<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor de Cadastros | T.U.C.U.V.O.R.I.</title>

    <!-- FIREBASE BASE -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

    <!-- BIBLIOTECA GERAR PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --vermelho: #760d0d;
            --vermelho-escuro: #4d0707;
            --dourado: #c69a3b;
            --preto: #181818;
            --cinza: #6d6d6d;
            --cinza-claro: #f4f3f1;
            --branco: #ffffff;
            --borda: #dedbd5;
            --perigo: #c0392b;
            --sucesso: #27ae60;
            --sombra: 0 10px 30px rgba(0, 0, 0, .08);
            --raio: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f2f1ef;
            color: var(--preto);
            padding-bottom: 40px;
        }

        header {
            background: linear-gradient(145deg, var(--vermelho-escuro), var(--vermelho));
            color: white;
            padding: 25px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 22px;
            margin-bottom: 5px;
        }

        header p {
            font-size: 13px;
            color: var(--cinza-claro);
        }

        .container {
            max-width: 1100px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .controles {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .busca {
            flex: 1;
            min-width: 250px;
            padding: 12px 15px;
            border: 1px solid var(--borda);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .grid-cadastros {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
        }

        .card-resumo {
            background: white;
            border-radius: var(--raio);
            padding: 18px;
            box-shadow: var(--sombra);
            border-left: 5px solid var(--vermelho);
            cursor: pointer;
            transition: transform .2s, box-shadow .2s;
            position: relative;
        }

        .card-resumo:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(0,0,0,.12);
        }

        .card-resumo h3 {
            font-size: 16px;
            color: var(--vermelho);
            margin-bottom: 6px;
        }

        .card-resumo p {
            font-size: 13px;
            color: var(--cinza);
            margin-bottom: 4px;
        }

        .badge-id {
            display: inline-block;
            background: #f5f1e6;
            color: #73591d;
            font-size: 11px;
            padding: 3px 7px;
            border-radius: 4px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .acoes-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid #f0f0f0;
        }

        .btn-excluir {
            background: transparent;
            border: none;
            color: var(--perigo);
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            padding: 5px 8px;
            border-radius: 4px;
            transition: background .2s;
        }

        .btn-excluir:hover {
            background: #fde8e8;
        }

        /* MODAL DETALHES */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 15px;
        }

        .modal.visivel {
            display: flex;
        }

        .modal-conteudo {
            background: white;
            border-radius: var(--raio);
            width: 100%;
            max-width: 850px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 25px;
            position: relative;
        }

        .fechar-modal {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #eee;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
        }

        .secao-detalhe {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .secao-detalhe h4 {
            color: var(--vermelho);
            font-size: 14px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-left: 3px solid var(--vermelho);
            padding-left: 8px;
        }

        .grid-detalhes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
        }

        .item-detalhe {
            font-size: 13px;
        }

        .item-detalhe strong {
            display: block;
            color: #555;
            font-size: 11px;
            text-transform: uppercase;
        }

        /* FORMULÁRIO EDIÇÃO */
        .campo-edicao {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .campo-edicao label {
            font-size: 11px;
            font-weight: bold;
            color: #444;
            text-transform: uppercase;
        }

        .campo-edicao input, .campo-edicao select, .campo-edicao textarea {
            padding: 8px 10px;
            border: 1px solid var(--borda);
            border-radius: 6px;
            font-size: 13px;
            width: 100%;
        }

        .doc-link {
            display: inline-block;
            margin-top: 5px;
            color: var(--vermelho);
            text-decoration: underline;
            font-size: 12px;
        }

        .modal-rodape {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            flex-wrap: wrap;
            gap: 10px;
        }

        .grupo-botoes {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-acao {
            border: none;
            padding: 10px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-pdf { background: #27ae60; color: white; }
        .btn-imprimir { background: #34495e; color: white; }
        .btn-editar { background: var(--dourado); color: white; }
        .btn-salvar { background: var(--sucesso); color: white; }
        .btn-cancelar { background: #95a5a6; color: white; }
        .btn-excluir-modal { background: var(--perigo); color: white; }

        .vazio {
            text-align: center;
            color: var(--cinza);
            padding: 40px;
            grid-column: 1 / -1;
        }

        .cabecalho-impressao {
            display: none;
            text-align: center;
            padding-bottom: 15px;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--vermelho);
        }

        .cabecalho-impressao h2 { font-size: 18px; color: var(--vermelho); }
        .cabecalho-impressao p { font-size: 12px; color: #666; }

        @media print {
            body { background: white !important; color: black !important; }
            header, .container, .fechar-modal, .modal-rodape, .doc-link { display: none !important; }
            .modal { position: static !important; display: block !important; background: transparent !important; padding: 0 !important; }
            .modal-conteudo { max-height: none !important; overflow: visible !important; box-shadow: none !important; border: none !important; padding: 0 !important; width: 100% !important; }
            .cabecalho-impressao { display: block !important; }
            .secao-detalhe { page-break-inside: avoid; }
        }
    </style>
</head>

<body>

    <header>
        <h1>Painel de Cadastros</h1>
        <p>Templo de Umbanda Caboclo Ubirajara e Vovó Rita (T.U.C.U.V.O.R.I.)</p>
    </header>

    <div class="container">
        <div class="controles">
            <input type="text" id="busca" class="busca" placeholder="Buscar por nome, CPF ou número do cadastro..." oninput="filtrarCadastros()">
        </div>

        <div id="gridCadastros" class="grid-cadastros">
            <div class="vazio">Carregando cadastros...</div>
        </div>
    </div>

    <!-- MODAL DE DETALHES -->
    <div id="modalDetalhes" class="modal">
        <div class="modal-conteudo" id="areaImpressaoPDF">
            <button class="fechar-modal" onclick="fecharModal()">✕</button>
            <div id="conteudoDetalhes"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCLfCY7VCgtW92f3Dlqst5yp6BTNqw5UQ",
            authDomain: "calendario-tucuvori.firebaseapp.com",
            databaseURL: "https://calendario-tucuvori-default-rtdb.firebaseio.com",
            projectId: "calendario-tucuvori",
            storageBucket: "calendario-tucuvori.firebasestorage.app",
            messagingSenderId: "364406314929",
            appId: "1:364406314929:web:ec7e7709bec677690b4f90"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let todosCadastros = {};
        let cadastroSelecionadoId = null;
        let modoEdicao = false;

        database.ref("cadastrosEntrada").on("value", snapshot => {
            todosCadastros = snapshot.val() || {};
            renderizarCadastros(todosCadastros);
        });

        function renderizarCadastros(dados) {
            const grid = document.getElementById("gridCadastros");
            grid.innerHTML = "";

            const ids = Object.keys(dados);

            if (ids.length === 0) {
                grid.innerHTML = `<div class="vazio">Nenhum cadastro encontrado.</div>`;
                return;
            }

            ids.reverse().forEach(id => {
                const item = dados[id];
                const info = item.cadastro || {};
                const docs = item.documentos || {};

                const card = document.createElement("div");
                card.className = "card-resumo";
                card.onclick = (e) => {
                    if (!e.target.classList.contains('btn-excluir')) {
                        abrirModal(id);
                    }
                };

                card.innerHTML = `
                    <span class="badge-id">${item.numeroCadastro || 'S/N'}</span>
                    <h3>${info.nomeCompleto || 'Nome não informado'}</h3>
                    <p><strong>WhatsApp:</strong> ${info.telefoneWhatsapp || '-'}</p>
                    <p><strong>CPF:</strong> ${docs.cpf || '-'}</p>
                    <p><strong>Entrada na TUCUVORI:</strong> ${formatarData(info.dataEntradaTucuvori)}</p>
                    
                    <div class="acoes-card">
                        <span style="font-size: 11px; color: #888;">Clique para abrir</span>
                        <button class="btn-excluir" onclick="excluirCadastro('${id}', event)">🗑️ Excluir</button>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        function filtrarCadastros() {
            const termo = document.getElementById("busca").value.toLowerCase();
            const filtrados = {};

            Object.keys(todosCadastros).forEach(id => {
                const item = todosCadastros[id];
                const info = item.cadastro || {};
                const docs = item.documentos || {};

                const nome = (info.nomeCompleto || "").toLowerCase();
                const cpf = (docs.cpf || "").toLowerCase();
                const num = (item.numeroCadastro || "").toLowerCase();

                if (nome.includes(termo) || cpf.includes(termo) || num.includes(termo)) {
                    filtrados[id] = item;
                }
            });

            renderizarCadastros(filtrados);
        }

        function abrirModal(id, editar = false) {
            cadastroSelecionadoId = id;
            modoEdicao = editar;
            const item = todosCadastros[id];
            if (!item) return;

            const c = item.cadastro || {};
            const e = item.emergencia || {};
            const d = item.documentos || {};
            const end = d.endereco || {};
            const s = item.saude || {};
            const esp = item.espiritual || {};
            const ent = esp.entidades || {};
            const comp = item.complementar || {};

            let html = '';

            if (modoEdicao) {
                html = `
                    <form id="formEdicao" onsubmit="salvarEdicao(event, '${id}')">
                        <span class="badge-id">${item.numeroCadastro || 'S/N'}</span>
                        <h2 style="color: var(--vermelho); margin-bottom: 15px;">Editando Cadastro Completo</h2>

                        <div class="secao-detalhe">
                            <h4>1. Dados Pessoais</h4>
                            <div class="grid-detalhes">
                                <div class="campo-edicao"><label>Nome Completo</label><input type="text" id="edit_nomeCompleto" value="${c.nomeCompleto || ''}"></div>
                                <div class="campo-edicao"><label>Data Nascimento</label><input type="date" id="edit_dataNascimento" value="${c.dataNascimento || ''}"></div>
                                <div class="campo-edicao"><label>Idade</label><input type="text" id="edit_idade" value="${c.idade || ''}"></div>
                                <div class="campo-edicao"><label>Faixa Etária</label><input type="text" id="edit_faixaEtaria" value="${c.faixaEtaria || ''}"></div>
                                <div class="campo-edicao"><label>Entrou na TUCUVORI</label><input type="date" id="edit_dataEntradaTucuvori" value="${c.dataEntradaTucuvori || ''}"></div>
                                <div class="campo-edicao"><label>Tempo de Casa</label><input type="text" id="edit_tempoTucuvori" value="${c.tempoTucuvori || ''}"></div>
                                <div class="campo-edicao"><label>Sexo Biológico</label><input type="text" id="edit_sexoBiologico" value="${c.sexoBiologico || ''}"></div>
                                <div class="campo-edicao"><label>Identidade Gênero</label><input type="text" id="edit_identidadeGenero" value="${c.identidadeGenero || ''}"></div>
                                <div class="campo-edicao"><label>Orientação Sexual</label><input type="text" id="edit_orientacaoSexual" value="${c.orientacaoSexual || ''}"></div>
                                <div class="campo-edicao"><label>WhatsApp</label><input type="text" id="edit_telefoneWhatsapp" value="${c.telefoneWhatsapp || ''}"></div>
                                <div class="campo-edicao"><label>Tel. Contato</label><input type="text" id="edit_telefoneContato" value="${c.telefoneContato || ''}"></div>
                                <div class="campo-edicao"><label>E-mail</label><input type="email" id="edit_email" value="${c.email || ''}"></div>
                            </div>
                        </div>

                        <div class="secao-detalhe">
                            <h4>Contato de Emergência</h4>
                            <div class="grid-detalhes">
                                <div class="campo-edicao"><label>Nome Contato</label><input type="text" id="edit_emergenciaNome" value="${e.nome || ''}"></div>
                                <div class="campo-edicao"><label>Parentesco</label><input type="text" id="edit_emergenciaParentesco" value="${e.parentesco || ''}"></div>
                                <div class="campo-edicao"><label>Telefone</label><input type="text" id="edit_emergenciaTelefone" value="${e.telefone || ''}"></div>
                            </div>
                        </div>

                        <div class="secao-detalhe">
                            <h4>Documentos & Endereço</h4>
                            <div class="grid-detalhes">
                                <div class="campo-edicao"><label>RG</label><input type="text" id="edit_rg" value="${d.rg || ''}"></div>
                                <div class="campo-edicao"><label>CPF</label><input type="text" id="edit_cpf" value="${d.cpf || ''}"></div>
                                <div class="campo-edicao"><label>Rua</label><input type="text" id="edit_rua" value="${end.rua || ''}"></div>
                                <div class="campo-edicao"><label>Número</label><input type="text" id="edit_numero" value="${end.numero || ''}"></div>
                                <div class="campo-edicao"><label>Bairro</label><input type="text" id="edit_bairro" value="${end.bairro || ''}"></div>
                                <div class="campo-edicao"><label>Cidade</label><input type="text" id="edit_cidade" value="${end.cidade || ''}"></div>
                                <div class="campo-edicao"><label>UF</label><input type="text" id="edit_uf" value="${end.uf || ''}"></div>
                                <div class="campo-edicao"><label>CEP</label><input type="text" id="edit_cep" value="${end.cep || ''}"></div>
                            </div>
                        </div>

                        <div class="secao-detalhe">
                            <h4>2. Saúde (Campos Detalhados)</h4>
                            <div class="grid-detalhes">
                                <div class="campo-edicao"><label>Gestante?</label><input type="text" id="edit_gestante" value="${s.gestante || ''}"></div>
                                <div class="campo-edicao"><label>Tempo Gestação</label><input type="text" id="edit_gestanteTempo" value="${s.gestanteTempo || ''}"></div>
                                <div class="campo-edicao"><label>Fuma?</label><input type="text" id="edit_fuma" value="${s.fuma || ''}"></div>
                                <div class="campo-edicao"><label>Tempo Fuma</label><input type="text" id="edit_fumaTempo" value="${s.fumaTempo || ''}"></div>
                                <div class="campo-edicao"><label>Bebe?</label><input type="text" id="edit_bebe" value="${s.bebe || ''}"></div>
                                <div class="campo-edicao"><label>Tempo Bebe</label><input type="text" id="edit_bebeTempo" value="${s.bebeTempo || ''}"></div>
                                <div class="campo-edicao"><label>Vícios?</label><input type="text" id="edit_temVicios" value="${s.temVicios || ''}"></div>
                                <div class="campo-edicao"><label>Info Vícios</label><input type="text" id="edit_viciosInfo" value="${s.viciosInfo || ''}"></div>

                                <div class="campo-edicao"><label>Hipertensão?</label><input type="text" id="edit_hipertensao" value="${s.hipertensao || ''}"></div>
                                <div class="campo-edicao"><label>Info Hipertensão</label><input type="text" id="edit_hipertensaoInfo" value="${s.hipertensaoInfo || ''}"></div>
                                <div class="campo-edicao"><label>Diabetes?</label><input type="text" id="edit_diabetes" value="${s.diabetes || ''}"></div>
                                <div class="campo-edicao"><label>Info Diabetes</label><input type="text" id="edit_diabetesInfo" value="${s.diabetesInfo || ''}"></div>

                                <div class="campo-edicao"><label>Teve AVC?</label><input type="text" id="edit_avc" value="${s.avc || ''}"></div>
                                <div class="campo-edicao"><label>Quando AVC?</label><input type="text" id="edit_avcQuando" value="${s.avcQuando || ''}"></div>
                                <div class="campo-edicao"><label>Infarto?</label><input type="text" id="edit_infarto" value="${s.infarto || ''}"></div>
                                <div class="campo-edicao"><label>Quando Infarto?</label><input type="text" id="edit_infartoQuando" value="${s.infartoQuando || ''}"></div>

                                <div class="campo-edicao"><label>Doença Cardíaca</label><input type="text" id="edit_doencaCardiaca" value="${s.doencaCardiaca || ''}"></div>
                                <div class="campo-edicao"><label>Qual Cardíaca?</label><input type="text" id="edit_cardiacaQual" value="${s.cardiacaQual || ''}"></div>
                                <div class="campo-edicao"><label>Rins?</label><input type="text" id="edit_rins" value="${s.rins || ''}"></div>
                                <div class="campo-edicao"><label>Qual Rins?</label><input type="text" id="edit_rinsQual" value="${s.rinsQual || ''}"></div>

                                <div class="campo-edicao"><label>Respiratório?</label><input type="text" id="edit_respiratorio" value="${s.respiratorio || ''}"></div>
                                <div class="campo-edicao"><label>Qual Respiratório?</label><input type="text" id="edit_respiratorioQual" value="${s.respiratorioQual || ''}"></div>
                                <div class="campo-edicao"><label>Tuberculose?</label><input type="text" id="edit_tuberculose" value="${s.tuberculose || ''}"></div>
                                <div class="campo-edicao"><label>Quando Tuberculose?</label><input type="text" id="edit_tuberculoseQuando" value="${s.tuberculoseQuando || ''}"></div>

                                <div class="campo-edicao"><label>Câncer?</label><input type="text" id="edit_cancer" value="${s.cancer || ''}"></div>
                                <div class="campo-edicao"><label>Quando Câncer?</label><input type="text" id="edit_cancerQuando" value="${s.cancerQuando || ''}"></div>
                                <div class="campo-edicao"><label>Internação 12m?</label><input type="text" id="edit_internacao" value="${s.internacao || ''}"></div>
                                <div class="campo-edicao"><label>Motivo Internação</label><input type="text" id="edit_internacaoMotivo" value="${s.internacaoMotivo || ''}"></div>

                                <div class="campo-edicao"><label>Psiquiatra?</label><input type="text" id="edit_psiquiatra" value="${s.psiquiatra || ''}"></div>
                                <div class="campo-edicao"><label>Info Psiquiatra</label><input type="text" id="edit_psiquiatraInfo" value="${s.psiquiatraInfo || ''}"></div>
                                <div class="campo-edicao"><label>Ansiedade?</label><input type="text" id="edit_ansiedade" value="${s.ansiedade || ''}"></div>
                                <div class="campo-edicao"><label>Depressão?</label><input type="text" id="edit_depressao" value="${s.depressao || ''}"></div>

                                <div class="campo-edicao"><label>Tipo Sanguíneo</label><input type="text" id="edit_tipoSanguineo" value="${s.tipoSanguineo || ''}"></div>
                                <div class="campo-edicao"><label>Alergia a Ervas?</label><input type="text" id="edit_alergiaErva" value="${s.alergiaErva || ''}"></div>
                                <div class="campo-edicao"><label>Qual Erva?</label><input type="text" id="edit_alergiaErvaQual" value="${s.alergiaErvaQual || ''}"></div>
                                <div class="campo-edicao"><label>Alergia Alimentar?</label><input type="text" id="edit_alergiaAlimentar" value="${s.alergiaAlimentar || ''}"></div>
                                <div class="campo-edicao"><label>Qual Alimento?</label><input type="text" id="edit_alergiaAlimentarQual" value="${s.alergiaAlimentarQual || ''}"></div>

                                <div class="campo-edicao"><label>Medicamentos Contínuos</label><input type="text" id="edit_medicamentosContinuosTexto" value="${s.medicamentosContinuosTexto || ''}"></div>

            try {

        }

            const opcoes = {
                margin: 8,
                filename: nomeArquivo,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opcoes).from(containerPdf).save();

        function imprimirCadastro() {
            window.print();
        }

        function fecharModal() {
            document.getElementById("modalDetalhes").classList.remove("visivel");
            cadastroSelecionadoId = null;
            modoEdicao = false;
        }

        async function excluirCadastro(id, evento) {
            if (evento) evento.stopPropagation();

            const item = todosCadastros[id];
            const nome = item?.cadastro?.nomeCompleto || 'este cadastro';

            if (confirm(`Tem certeza que deseja excluir o cadastro de "${nome}"?\n\nEsta ação não poderá ser desfeita.`)) {
                try {
                    await database.ref(`cadastrosEntrada/${id}`).remove();
                    alert("Cadastro excluído com sucesso!");
                    if (cadastroSelecionadoId === id) {
                        fecharModal();
                    }
                } catch (erro) {
                    console.error("Erro ao excluir:", erro);
                    alert("Ocorreu um erro ao excluir o cadastro. Tente novamente.");
                }
            }
        }

        function formatarData(dataIso) {
            if (!dataIso) return '-';
            try {
                const partes = dataIso.split("T")[0].split("-");
                if (partes.length === 3) {
                    return `${partes[2]}/${partes[1]}/${partes[0]}`;
                }
                return dataIso;
            } catch (e) {
                return dataIso;
            }
        }
